apiVersion: apps/v1
kind: Deployment
metadata:
  name: blazingpizza-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blazingpizza-api
  template:
    metadata:
      labels:
        app: blazingpizza-api
    spec:
      containers:
        - name: blazingpizza-api
          image: blazingpizzaserver:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: http://+:80

---
apiVersion: v1
kind: Service
metadata:
  name: blazingpizza-api-service
spec:
  type: NodePort
  selector:
    app: blazingpizza-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080